<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuickAudit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.5 12 2.5 2.5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>QuickAudit</span>
    </div>
    <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </header>

  <div id="target" class="target"></div>

  <section id="scoreboard" class="scoreboard" hidden>
    <div class="score">
      <svg viewBox="0 0 44 44" width="56" height="56" class="ring">
        <circle cx="22" cy="22" r="19" class="ring-bg"/>
        <circle cx="22" cy="22" r="19" class="ring-fg" id="ring"/>
      </svg>
      <span id="score-num">–</span>
    </div>
    <ul class="tally">
      <li><b id="n-fail">0</b><span>failed</span></li>
      <li><b id="n-warn">0</b><span>warnings</span></li>
      <li><b id="n-pass">0</b><span>passed</span></li>
      <li><b id="n-skip">0</b><span>skipped</span></li>
    </ul>
  </section>

  <main id="results" class="results">
    <div id="idle" class="empty">
      <p>Run a ten-point security checklist against this page.</p>
      <p class="fine">Nothing leaves your browser except library <code>name@version</code> strings, sent to OSV.dev to look up known CVEs.</p>
    </div>
  </main>

  <div id="notes" class="notes" hidden></div>

  <footer>
    <button id="scan" class="primary">Scan this page</button>
    <button id="export" class="ghost" hidden>Export report</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
