# Copy this into .github/workflows/ in your own repository.
#
# Runs QuickAudit's ten security checks against a deployed URL on every pull request and
# fails the build if a high-severity misconfiguration appears. Catches the case where a
# change quietly drops your CSP or downgrades HSTS, before it reaches production.

name: Security checklist

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Configuration drifts without anyone touching the repo — a CDN setting changes, a
    # dependency ships a new bundle. A weekly run catches that; pull requests alone don't.
    - cron: '0 7 * * 1'

permissions:
  contents: read
  pull-requests: write   # only needed for `comment: true`

jobs:
  quickaudit:
    runs-on: ubuntu-latest
    steps:
      - uses: BAB78/quickaudit@v1
        with:
          url: https://staging.example.com

          # Lowest severity that fails the build.
          # critical | high | medium | low | never
          fail-on: high

          # Post the findings on the pull request, updating the same comment each run.
          comment: true
          github-token: ${{ github.token }}

---
